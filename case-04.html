<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050403"><title>Прогулка по городу</title><style>
*{box-sizing:border-box}
html,body{margin:0;background:#050403;color:#d6af6d;font-family:Georgia,"Times New Roman",serif}
body{min-height:100vh;overflow-x:hidden}
.poster{
  position:relative;
  width:min(100vw,430px);
  aspect-ratio:853/1844;
  margin:0 auto;
  background:#050403;
}
.poster>img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;z-index:8;display:block;background:transparent;border:0;padding:0;text-decoration:none;-webkit-tap-highlight-color:transparent}
.hot:focus-visible{outline:2px solid #d7b171;outline-offset:2px}

/* Actual clickable areas over the background artwork */
.art-back{left:3.8%;top:2.1%;width:14%;height:6.6%}
.art-menu{right:3.8%;top:2.1%;width:14%;height:6.6%}

/* Visible navigation added to screens that don't have artwork controls. */
.floating-menu{
  position:fixed;z-index:60;
  top:max(14px,env(safe-area-inset-top));right:14px;
  width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;
  border:1px solid #a77a3d;background:rgba(12,8,5,.92);
  color:#d6ad68;box-shadow:0 6px 18px #000b;
  font-size:23px;line-height:1;
}
.floating-home{
  position:fixed;z-index:60;
  top:max(14px,env(safe-area-inset-top));left:14px;
  width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;text-decoration:none;
  border:1px solid #a77a3d;background:rgba(12,8,5,.92);
  color:#d6ad68;box-shadow:0 6px 18px #000b;
  font-size:20px;
}
.nav-panel{
  position:fixed;inset:0;z-index:100;display:none;
  background:rgba(4,3,2,.94);backdrop-filter:blur(8px);
  padding:max(80px,calc(env(safe-area-inset-top) + 64px)) 18px 28px;
}
.nav-panel.open{display:block}
.nav-card{
  width:min(100%,410px);margin:0 auto;border:1px solid #8d6330;
  background:linear-gradient(#181009,#0c0805);padding:16px;
  box-shadow:0 16px 38px #000d
}
.nav-title{text-align:center;font-weight:700;font-size:22px;margin:4px 0 14px;color:#d9b574}
.nav-card a,.nav-card button{
  display:block;width:100%;padding:14px 12px;margin:8px 0;
  text-align:center;text-decoration:none;border:1px solid #755027;
  background:#21140c;color:#d8b372;font-weight:700
}
.nav-card button{background:#641b12;border-color:#913d28}

@media(min-width:431px){
  .poster{box-shadow:0 0 50px #000}
}
</style></head>
