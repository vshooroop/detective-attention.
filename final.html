<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050403">
<title>До встречи в новых делах</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050403;overflow:hidden}
body{font-family:Georgia,"Times New Roman",serif;color:#d8b474}
.screen{
  position:relative;
  width:min(100vw, 430px);
  height:100dvh;
  margin:0 auto;
  background:#050403;
  overflow:hidden;
  box-shadow:0 0 50px #000;
}
.screen>img{
  display:block;width:100%;height:100%;
  object-fit:cover;object-position:center top;
  user-select:none;-webkit-user-drag:none;
}
.hot{
  position:absolute;z-index:10;display:block;
  background:transparent;border:0;padding:0;margin:0;
  cursor:pointer;text-decoration:none;
  -webkit-tap-highlight-color:transparent;
}
.hot:focus-visible{outline:2px solid #d5ad6d;outline-offset:2px}
.back{left:3.4%;top:2.1%;width:14%;height:7.2%}
.menu{right:3.4%;top:2.1%;width:14%;height:7.2%}
.menu-panel{
  position:absolute;inset:0;z-index:50;display:none;
  background:rgba(5,3,2,.94);backdrop-filter:blur(8px);
  padding:18vh 8% 8%;
}
.menu-panel.open{display:block}
.menu-card{
  border:1px solid #8b622f;
  background:linear-gradient(180deg,#171009,#0b0704);
  box-shadow:0 12px 34px #000;
  padding:18px;
}
.menu-title{text-align:center;color:#d4ad6f;font-weight:700;font-size:22px;margin:0 0 14px}
.menu-card a,.menu-card button{
  display:block;width:100%;margin:9px 0;padding:14px 12px;
  border:1px solid #765028;background:#20130c;color:#d9b575;
  text-align:center;text-decoration:none;font-weight:700;
}
.menu-card button{background:#651a12;border-color:#8f3a26}
@media (min-width:431px){body{display:flex;justify-content:center;align-items:center}.screen{height:min(100dvh,930px)}}
</style>
